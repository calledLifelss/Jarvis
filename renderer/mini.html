<!DOCTYPE html>
<html lang="en" data-theme="jarvis-dark">
<head>
<meta charset="UTF-8" />
<title>Jarvis Orb</title>
<link rel="stylesheet" href="themes.css" />
<link rel="stylesheet" href="pack-fonts.css" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="packs.css" />
<link rel="stylesheet" href="pack-icons.css" />
<style>
  html, body { background: var(--bg); }
  body { align-items: stretch; justify-content: flex-start; flex-direction: column;
    padding: 0; overflow: hidden; }
  .dock-head {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-bottom: 1px solid var(--hairline);
    background: var(--panel); -webkit-app-region: drag; cursor: grab;
    font: 10px var(--mono); color: var(--faint);
  }
  .dock-head:active { cursor: grabbing; }
  .dock-dot { width: 7px; height: 7px; background: var(--accent); flex-shrink: 0; }
  .dock-head span:last-child { margin-left: auto; }
  .mini-wrap { position: relative; width: 120px; height: 120px; margin: 10px auto 4px;
    -webkit-app-region: no-drag; }
  .mini-wrap canvas { width: 120px; height: 120px; }
  .mini-tint { position: absolute; inset: 4px; background: rgba(229,72,77,.30);
    opacity: 0; transition: opacity .15s; pointer-events: none; -webkit-app-region: no-drag; }
  .mini-x { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 44px; font-weight: 300; color: #fff;
    opacity: 0; transition: opacity .15s; cursor: pointer;
    -webkit-app-region: no-drag; pointer-events: none; }
  .mini-wrap:hover .mini-tint, .mini-wrap:hover .mini-x { opacity: 1; }
  .mini-wrap:hover .mini-x { pointer-events: auto; }
  .mini-state { font: 10px var(--mono); color: var(--faint); text-align: center;
    padding: 0 10px; }
  .mini-chat { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; -webkit-app-region: no-drag; }
  .mini-chat input { border-radius: var(--r-sm); border: 1px solid var(--border);
    background: var(--inset); color: var(--text); padding: 8px 10px; outline: none;
    font-size: 12px; width: 100%; }
  .mini-chat input:focus { border-color: var(--accent-dim); }
  .mini-sub { text-align: center; }
  .mini-sub button { background: none; border: none; color: var(--faint); cursor: pointer;
    font: 11px var(--mono); padding: 2px 6px; }
  .mini-sub button:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="dock-head"><span class="dock-dot"></span><span>Jarvis dock</span><span>always on top</span></div>
  <div class="mini-wrap" id="orb-wrap">
    <canvas id="orb" width="300" height="300"></canvas>
    <div class="mini-tint"></div>
    <div class="mini-x" id="mini-x" title="Hide orb">✕</div>
  </div>
  <div class="mini-state" id="mini-state">idle</div>
  <div class="mini-chat">
    <input id="mini-input" placeholder="Message Jarvis…" />
    <div class="mini-sub"><button id="mini-back" title="Back to chatroom">open full chatroom</button></div>
  </div>
<script src="orb.js"></script>
<script>
  window.setOrbState('idle');
  document.getElementById('mini-x').addEventListener('click', () => window.jarvis?.miniCloseOrb());
  document.getElementById('mini-back').addEventListener('click', () => window.jarvis?.exitMiniMode());
  const miniInput = document.getElementById('mini-input');
  miniInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && miniInput.value.trim()) {
      try { localStorage.setItem('jarvis-mini-pending', miniInput.value.trim()); } catch {}
      window.jarvis?.exitMiniMode();
    }
  });
  const t = localStorage.getItem('jarvis-theme');
  if (t) document.documentElement.dataset.theme = t;
</script>
</body>
</html>
